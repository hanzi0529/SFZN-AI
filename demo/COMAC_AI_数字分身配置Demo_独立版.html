一、重点事件
1. EASA 更新大型飞机持续适航相关指导材料，重点强化运营阶段结构检查记录。
2. FAA 发布一项拟议适航指令，涉及特定机型航电软件版本核查。
3. 国内适航信息未发现影响当前型号运行安全的紧急指令。

当前信息对在研型号无立即停场影响，建议持续跟踪软件符合性要求及后续正式指令。

• 某结构件供应商一次检验通过率较上周下降 4.2%。
